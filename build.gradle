plugins {
    // 使用 Fabric Loom 配置 Minecraft、Yarn 映射和 Fabric Loader。
    id 'fabric-loom' version "${loom_version}"
    // 使用 Java 插件提供标准编译和打包任务。
    id 'java'
}

// 使用模组组名作为 Maven 坐标的组织名。
group = mod_group_id
// 使用带 Minecraft 和加载器信息的发布版本号。
version = "${minecraft_version}-fabric-${mod_version}"

// 使用稳定的模组 ID 作为 JAR 基础文件名。
base {
    archivesName = mod_id
}

// 使用 Minecraft 1.19.2 对应的 Java 17 工具链。
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

// 使用 Fabric Maven 提供 Loom 和运行时依赖。
repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

// 声明当前变体所需的 Minecraft、Yarn 和 Fabric Loader。
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

loom {
    // 使用 Fabric Loom 已确认的 Mixin 扩展配置默认 refmap 名称。
    mixin.setDefaultRefmapName("${mod_id}.refmap.json")
}

// 将 Gradle 属性展开到 Fabric 模组元数据。
processResources {
    inputs.properties([
            minecraft_version: minecraft_version,
            loader_version: loader_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: project.version,
            mod_description: mod_description
    ])
    filteringCharset = 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand([
                minecraft_version: minecraft_version,
                loader_version: loader_version,
                mod_id: mod_id,
                mod_name: mod_name,
                mod_license: mod_license,
                mod_version: project.version,
                mod_description: mod_description
        ])
    }
}

// 统一使用 UTF-8，并限制 Java 编译目标为 Java 17。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
